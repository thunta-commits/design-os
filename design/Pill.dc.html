<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/styles.css">
  <script src="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.js"></script>
</helmet>
<x-import component-from-global-scope="LuminDS.Badge" variant="secondary" dc-props="{{ badgeProps }}" hint-size="auto,20px">{{ label }}</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;In progress&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;in-progress&quot;,&quot;in-review&quot;,&quot;up-next&quot;,&quot;done&quot;,&quot;to-read&quot;,&quot;reading&quot;,&quot;read&quot;,&quot;sample&quot;,&quot;critical&quot;,&quot;warning&quot;,&quot;info&quot;,&quot;design&quot;,&quot;none&quot;],&quot;default&quot;:&quot;in-progress&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  'in-progress': ['var(--custom-amber-50-dark-amber-950)', 'var(--custom-amber-900-dark-amber-50)'],
  'reading': ['var(--custom-amber-50-dark-amber-950)', 'var(--custom-amber-900-dark-amber-50)'],
  'warning': ['var(--custom-amber-50-dark-amber-950)', 'var(--custom-amber-900-dark-amber-50)'],
  'in-review': ['var(--card-violet)', 'var(--card-violet-foreground)'],
  'up-next': ['var(--muted)', 'var(--secondary-foreground)'],
  'done': ['var(--card-green)', 'var(--card-green-foreground)'],
  'read': ['var(--card-green)', 'var(--card-green-foreground)'],
  'to-read': ['var(--card-blue)', 'var(--card-blue-foreground)'],
  'sample': ['var(--card-orange)', 'var(--card-orange-foreground)'],
  'critical': ['var(--card-red)', 'var(--card-red-foreground)'],
  'info': ['var(--card-sky)', 'var(--card-sky-foreground)'],
  'design': ['var(--card-indigo)', 'var(--card-indigo-foreground)'],
  'none': ['transparent', 'var(--muted-foreground)'],
};
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'up-next';
    const [bg, fg] = TONES[tone] || TONES['up-next'];
    const style = { background: bg, color: fg, whiteSpace: 'nowrap', fontWeight: 500 };
    if (tone === 'none') style.border = '1px dashed var(--border)';
    return { label: this.props.label ?? 'In progress', badgeProps: { style } };
  }
}
</script>
</body>
</html>
