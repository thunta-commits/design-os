<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/styles.css">
  <script src="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.js"></script>
</helmet>
<button type="button" onClick="{{ open }}" style="display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:8px 10px; border:0; border-radius:8px; background:transparent; color:var(--foreground); text-align:left; cursor:pointer; font:inherit;" style-hover="background:var(--muted);">
  <span style="flex:none; width:68px; font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:12px; color:var(--muted-foreground);">{{ issue.identifier }}</span>
  <span style="flex:1; min-width:0; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ issue.title }}</span>
  <sc-if value="{{ showMeta }}" hint-placeholder-val="{{ true }}">
    <dc-import name="Pill" label="{{ issue.designLabel }}" tone="{{ designTone }}" hint-size="auto,20px"></dc-import>
    <dc-import name="Pill" label="{{ statusLabel }}" tone="{{ issue.bucket }}" hint-size="auto,20px"></dc-import>
  </sc-if>
  <sc-if value="{{ showDue }}" hint-placeholder-val="{{ true }}">
    <span style="flex:none; min-width:64px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; color:{{ issue.dueColor }}; font-weight:{{ issue.dueWeight }};">{{ issue.dueText }}</span>
  </sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:60},&quot;issue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;IssueVM&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;compact&quot;,&quot;status-only&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(identifier: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const issue = this.props.issue ?? { identifier: 'DES-214', title: 'Share dialog: permission levels & link settings', designLabel: 'Design', hasDesign: true, bucket: 'in-progress', bucketLabel: 'In progress', stateName: 'In Progress', dueText: 'Tomorrow', dueColor: 'var(--custom-amber-900-dark-amber-50)', dueWeight: 600 };
    const variant = this.props.variant ?? 'full'; // full | compact | status
    return {
      issue,
      showMeta: variant !== 'compact' && variant !== 'status-only',
      showDue: variant !== 'status-only',
      statusLabel: issue.bucketLabel,
      designTone: issue.hasDesign ? 'design' : 'none',
      open: () => this.props.onOpen && this.props.onOpen(issue.identifier),
    };
  }
}
</script>
</body>
</html>
