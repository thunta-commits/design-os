<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/styles.css">
  <script src="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.js"></script>
</helmet>
<div style="display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; background:var(--card); overflow:hidden; min-width:0;">
  <a href="{{ file.url }}" target="_blank" rel="noreferrer" aria-label="Open {{ file.name }} in Figma" style="position:relative; display:flex; flex-direction:column; gap:8px; height:{{ thumbH }}; padding:16px; background:var(--muted); text-decoration:none; border-bottom:1px solid var(--border);">
    <span style="display:block; height:8px; width:{{ file.wireW }}; border-radius:3px; background:var(--border);"></span>
    <span style="display:block; flex:1; border-radius:6px; background:var(--card); border:1px solid var(--border);"></span>
    <span style="display:flex; gap:6px;">
      <span style="display:block; height:14px; width:38%; border-radius:3px; background:var(--border);"></span>
      <span style="display:block; height:14px; width:24%; border-radius:3px; background:var(--primary); opacity:0.75;"></span>
    </span>
    <span style="position:absolute; top:8px; right:8px; display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:999px; background:var(--card); border:1px solid var(--border); font-size:11px; color:var(--foreground);">Open <x-import component-from-global-scope="LuminDS.ArrowUpRightIcon" size="11" hint-size="11px,11px"></x-import></span>
  </a>
  <div style="display:flex; flex-direction:column; gap:4px; padding:10px 12px 12px;">
    <span title="{{ file.name }}" style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--foreground);">{{ file.name }}</span>
    <span style="font-size:12px; color:var(--muted-foreground);">{{ file.sub }}</span>
    <span style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="1">
        <button type="button" title="{{ l.title }}" onClick="{{ l.open }}" style="padding:1px 7px; border-radius:6px; border:1px solid var(--border); background:var(--background); font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:11px; color:var(--foreground); cursor:pointer;" style-hover="background:var(--muted);">{{ l.identifier }}</button>
      </sc-for>
      <sc-if value="{{ unlinked }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:11px; color:var(--muted-foreground); font-style:italic;">Not linked to an issue</span>
      </sc-if>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:230},&quot;file&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FileVM&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpenIssue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(identifier: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const file = this.props.file ?? { name: 'Share dialog — permissions v4', url: '#', sub: 'Sign & Share · edited 2h ago', wireW: '58%', issues: [{ identifier: 'DES-214', title: 'Share dialog: permission levels & link settings' }] };
    return {
      file,
      thumbH: this.props.compact ? '96px' : '124px',
      unlinked: !file.issues.length,
      links: file.issues.map((i) => ({ ...i, open: () => this.props.onOpenIssue && this.props.onOpenIssue(i.identifier) })),
    };
  }
}
</script>
</body>
</html>
