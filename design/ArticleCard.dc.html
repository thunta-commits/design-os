<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/styles.css">
  <script src="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.js"></script>
</helmet>
<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
  <article title="{{ article.hoverMeta }}" style="display:flex; flex-direction:column; gap:8px; height:100%; box-sizing:border-box; padding:16px 16px 14px; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--card-foreground);" style-hover="border-color:var(--ring);">
    <div style="display:flex; align-items:center; gap:8px; min-height:24px;">
      <span style="font-size:12px; font-weight:500; color:var(--muted-foreground);">{{ article.topicName }}</span>
      <button type="button" aria-pressed="{{ article.favorite }}" aria-label="{{ favLabel }}" onClick="{{ toggleFav }}" style="margin:-4px -6px -4px auto; display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:0; border-radius:6px; background:transparent; color:{{ starColor }}; cursor:pointer;" style-hover="background:var(--muted);">
        <x-import component-from-global-scope="LuminDS.StarIcon" size="16" weight="{{ starWeight }}" hint-size="16px,16px"></x-import>
      </button>
    </div>
    <button type="button" onClick="{{ open }}" style="padding:0; border:0; background:transparent; text-align:left; font:inherit; font-size:15px; font-weight:600; line-height:1.35; letter-spacing:-0.01em; color:var(--foreground); cursor:pointer; text-wrap:pretty; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" style-hover="text-decoration:underline;">{{ article.title }}</button>
    <span style="font-size:12px; color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ article.byline }}</span>
    <p style="margin:2px 0 0; font-size:13px; line-height:1.5; color:var(--muted-foreground); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:4.5em;">{{ article.summary }}</p>
    <div style="display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:8px; min-width:0;">
      <dc-import name="Pill" label="{{ article.statusLabel }}" tone="{{ article.status }}" hint-size="auto,20px"></dc-import>
      <span style="flex:1; min-width:0; font-size:12px; color:var(--muted-foreground); white-space:pre; overflow:hidden; text-overflow:ellipsis; text-align:right;">{{ article.tagLine }}</span>
    </div>
  </article>
</sc-if>
<sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex; align-items:center; gap:12px; padding:8px 10px; border-bottom:1px solid var(--border); color:var(--foreground);">
    <button type="button" onClick="{{ open }}" style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; padding:0; border:0; background:transparent; text-align:left; font:inherit; cursor:pointer;">
      <strong style="font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ article.title }}</strong>
      <span style="font-size:12px; color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ article.byline }}</span>
    </button>
    <sc-if value="{{ showMeta }}" hint-placeholder-val="{{ true }}">
      <span style="flex:none; width:110px; font-size:13px; color:var(--muted-foreground);">{{ article.topicName }}</span>
      <span style="flex:none; width:56px; font-size:13px; color:var(--muted-foreground); font-variant-numeric:tabular-nums;">{{ article.saved }}</span>
    </sc-if>
    <dc-import name="Pill" label="{{ article.statusLabel }}" tone="{{ article.status }}" hint-size="auto,20px"></dc-import>
    <button type="button" aria-pressed="{{ article.favorite }}" aria-label="{{ favLabel }}" onClick="{{ toggleFav }}" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:0; border-radius:6px; background:transparent; color:{{ starColor }}; cursor:pointer;" style-hover="background:var(--muted);">
      <x-import component-from-global-scope="LuminDS.StarIcon" size="17" weight="{{ starWeight }}" hint-size="17px,17px"></x-import>
    </button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:280},&quot;article&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ArticleVM&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;list&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid' | 'list'&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;},&quot;onToggleFav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const article = this.props.article ?? { id: 'a-tokens', title: 'Design Tokens Format Module', byline: 'Design Tokens Community Group · W3C Community Group', topicName: 'Design systems', hasProject: true, projectName: 'Design System v3', summary: 'A draft spec for a shared, tool-agnostic JSON format for design tokens.', hasSummary: true, tags: ['#design-system', '#tokens'], hasTags: true, saved: '21 Oct', status: 'reading', statusLabel: 'Reading', favorite: true };
    const layout = this.props.layout ?? 'grid';
    return {
      article, isGrid: layout === 'grid', isList: layout === 'list', showMeta: !this.props.compact,
      starColor: article.favorite ? 'var(--card-amber-foreground)' : 'var(--muted-foreground)',
      starWeight: article.favorite ? 'fill' : 'regular',
      favLabel: article.favorite ? `Remove ${article.title} from favorites` : `Add ${article.title} to favorites`,
      open: () => this.props.onOpen && this.props.onOpen(article.id),
      toggleFav: (e) => { e && e.stopPropagation && e.stopPropagation(); this.props.onToggleFav && this.props.onToggleFav(article.id); },
    };
  }
}
</script>
</body>
</html>
