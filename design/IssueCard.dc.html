<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/styles.css">
  <script src="_ds/lumin-design-system-c071ef8f-34eb-4b94-afe2-cfc8a6283075/_ds_bundle.js"></script>
</helmet>
<button type="button" onClick="{{ open }}" style="display:flex; flex-direction:column; gap:8px; width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--card-foreground); text-align:left; cursor:pointer; font:inherit; box-shadow:0 1px 2px rgb(0 0 0 / 0.04);" style-hover="border-color:var(--ring);">
  <span style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
    <span style="font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:12px; color:var(--muted-foreground);">{{ issue.identifier }}</span>
    <span style="display:inline-flex; align-items:center; gap:4px; font-size:12px; color:{{ issue.priorityColor }};">
      <x-import component-from-global-scope="{{ issue.priorityIcon }}" size="14" hint-size="14px,14px"></x-import>{{ issue.priorityLabel }}
    </span>
  </span>
  <span style="font-size:14px; font-weight:500; line-height:1.35; text-wrap:pretty;">{{ issue.title }}</span>
  <span style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;">
    <sc-if value="{{ issue.hasProject }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:12px; color:var(--muted-foreground); padding:1px 6px; border-radius:6px; background:var(--muted);">{{ issue.projectName }}</span>
    </sc-if>
    <dc-import name="Pill" label="{{ issue.designLabel }}" tone="{{ designTone }}" hint-size="auto,20px"></dc-import>
    <span style="margin-left:auto; font-size:12px; color:{{ issue.dueColor }}; font-weight:{{ issue.dueWeight }};">{{ issue.dueText }}</span>
  </span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:140},&quot;issue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;IssueVM&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(identifier: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const issue = this.props.issue ?? { identifier: 'DES-221', title: 'eSign: signer field placement on mobile', priorityLabel: 'Urgent', priorityIcon: 'LuminDS.WarningIcon', priorityColor: 'var(--destructive)', hasProject: true, projectName: 'Sign & Share 2.0', designLabel: 'Design', hasDesign: true, dueText: 'Tomorrow', dueColor: 'var(--custom-amber-900-dark-amber-50)', dueWeight: 600 };
    return { issue, designTone: issue.hasDesign ? 'design' : 'none', open: () => this.props.onOpen && this.props.onOpen(issue.identifier) };
  }
}
</script>
</body>
</html>
